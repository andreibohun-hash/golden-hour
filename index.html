<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Золотой час</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d88a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Палитра UI — одно место. Свет мира (небо, вода, город) — таблица LIGHT в скрипте: он меняется каждым ходом. */
:root{
  --page:#0d0e14; --ink:#ffffff; --pill:rgba(12,14,28,.42);
  --card:#fbf8f0; --card-ink:#2b2621; --muted:#81786d; --btn:#ebe5d8; --accent:#f2a93b; --accent-ink:#2b1a04;
  --frame-w:440px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --card:#26232b; --card-ink:#f4efe6; --muted:#a69d91; --btn:#3a3640; }
}
:root[data-theme="dark"]{ --card:#26232b; --card-ink:#f4efe6; --muted:#a69d91; --btn:#3a3640; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:#d88a2a;overflow:hidden;
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 10px;pointer-events:none;z-index:2}
header .pill{background:var(--pill);color:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap}
header .sp{flex:1}
header button{pointer-events:auto;background:var(--pill);color:#fff;border:0;border-radius:999px;width:38px;height:38px;padding:0;
  display:grid;place-items:center;cursor:pointer}
header svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,16,.42);padding:18px;z-index:5}
#overlay.show{display:flex}
.card{background:var(--card);color:var(--card-ink);border-radius:6px;padding:20px 20px 26px;max-width:350px;width:100%;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .18s ease-out;max-height:92%;overflow:auto} /* стартует с видимого состояния (§9) */
@keyframes pop{from{transform:scale(.96) rotate(-1deg)}to{transform:scale(1) rotate(0)}}
.card h2{margin:4px 0 6px;font-size:24px} .card p{color:var(--muted);margin:0 0 14px}
.card .btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;margin:4px;background:var(--btn);color:var(--card-ink);cursor:pointer}
.card .btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:800}
.card .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}
.card .grid .btn{margin:0;padding:10px 0}
.card .grid .btn.done{outline:2px solid var(--accent)}
.card .seg{display:inline-flex;background:var(--btn);border-radius:12px;padding:3px;margin:2px 0 12px}

.card .seg .btn.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
.card table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 12px;text-align:left}
.card td{padding:4px 2px;border-bottom:1px solid rgba(128,120,110,.2)} .card td+td{text-align:right;font-variant-numeric:tabular-nums}

#toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:rgba(12,14,28,.72);color:#fff;padding:9px 14px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;z-index:4;width:max-content;max-width:86%;text-align:center;font-size:14px;line-height:1.3}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card{animation:none} #toast{transition:none} }

<script>
'use strict';
/* ЯДРО */
// =============================================================================================
// «Золотой час» — TriPeaks на полароидах одного города. Ранг кадра — время суток, шкала по кругу.
// Ход: открытый кадр на ступень раньше или позже текущего (после ночи — рассвет). Тот же час ходом не считается.
// Нет хода — плёнка (колода): её кадр становится текущим, серия рвётся. Победа — сняты все кадры.
// Плёнка кончилась на почти-победе — «+3 кадра». Это ядро исполняют игра, sim.mjs и test.mjs (core-load.mjs).
// v2 — развитие, правило совпадения не меняется:
//   шкала направления — полкруга ходов подряд в одну сторону кладут кадр на плёнку, полный круг («Полный день») даёт «Затмение»;
//   «Затмение» — к нему подходит любой открытый кадр, серию и шкалу не рвёт;
//   туча — кадр под ней не берётся, пока в видоискателе не день; фонарь — пока не ночь.
// =============================================================================================
const CFG = {
  // --- правило и баланс ---
  MODE_DEFAULT: 8,        // шкала глав «8 времён»; переключатель в меню меняет её на 10
  DECK_10_EXTRA: 4,       // на 10 временах плёнка длиннее на столько кадров: 12–13 → 16–17 (сим брейншторма)
  EXTRA_N: 3,             // «+3 кадра» на почти-победе
  EXTRA_MAX: 1,           // сколько раз за уровень
  NEAR_WIN: 4,            // почти-победа: плёнка пуста, хода нет, на столе осталось не больше стольких кадров
  GAUGE_ON: true,         // шкала направления (v2); false — правила спайка v1
  GAUGE_EVERY: 0,         // кадр на плёнку каждые столько ходов подряд в одну сторону; 0 — один раз на полкруга
  BONUS_POOL: 10,         // запас кадров под награды шкалы, раздаётся вместе с колодой
  WILD_MAX: 2,            // сколько «Затмений» можно копить
  // --- механики после 12-го уровня (вводятся по одной: 13, 15, 17, 19, 21) ---
  STAR_STREAK: 2,         // падающая звезда появляется, когда серия ≥ стольких ходов привела в ночь
  STAR_MOVES: 3,          // звезда висит столько действий, потом гаснет
  STAR_FRAMES: 1,         // поймал звезду — столько кадров на плёнку (2 делали игру легче, а выбор мельче — сим depth)
  STAR_PER_LEVEL: 2,      // звёзд за уровень
  FLASH_MOVES: 3,         // кадр со вспышкой проявляет все закрытые кадры на столько действий
  ORDER_NEED: 3,          // заказ: снять столько кадров одного времени
  ORDER_FRAMES: 1,        // выполненный заказ — столько кадров на плёнку (2 — легче и мельче, сим depth)
  ORDER_MAX: 2,           // заказов за уровень (второй — после первого)
  PRIZE_POOL: 12,         // запас кадров под награды звёзд и заказов (своя раздача, колоду уровня не трогает)
  PLAN_N: 24,             // прогонов на одно решение у бота-планировщика
  SOLVE_NODES: 300000,    // предел узлов полного перебора в аудите (с открытыми картами)
  JUICE_STREAK: 4,        // серия такой длины — «сочное событие» для метрики (наравне со снятым пиком и «Полным днём»)
  // --- раскладка (виртуальные юниты при ширине 400) ---
  TILE_MAX: 78,           // предельная ширина полароида на столе
  FIELD_COLS: 6,          // формы не шире стольких кадров: карточка ≈ 60 px на телефоне (8 в ряд — 45 px, на устройстве мелко)
  TILE_GAP: 2.5,          // зазор между соседями в ряду
  SIDE: 10,               // поле от края кадра
  POLA_RATIO: 1.13,       // высота полароида / ширина
  ROW_STEP: 0.6,          // шаг ряда в высотах полароида (перекрытие пиков)
  TILE_ROT_DEG: 4,        // разброс наклона полароидов, ±градусов
  HORIZON_FRAC: 0.22,     // горизонт залива — доля высоты экрана (небо — полоса сверху, остальное — поле на воде)
  PANEL_H: 150,           // высота фотоаппарата внизу (плёнка, видоискатель, объективы-соседи, шкала, затмение)
  VF_W: 84,               // сторона кадра в видоискателе
  THUMB_W: 60,            // диаметр объективов с соседними временами
  // --- эффекты (мс, абсолютное время) ---
  WORLD_MS: 400,          // мир переходит в новое время
  LIFT_MS: 90,            // кадр приподнимается под пальцем перед полётом
  FLIGHT_MS: 340,         // кадр летит в видоискатель (по дуге, с переворотом)
  LAND_MS: 220,           // приземление в видоискатель: сплющивание и шторка затвора
  REVEAL_MS: 700,         // открытый кадр проявляется
  SHAKE_MS: 320,          // неверный кадр вздрагивает
  FLASH_MS: 300,          // вспышка затвора на снятом пике
  UNVEIL_MS: 650,         // туча расходится, фонарь загорается
  BONUS_MS: 520,          // кадр шкалы летит на плёнку
  ORBIT_DELAY_MS: 380,    // «Полный день»: оборот светил стартует после обычного перехода
  ORBIT_MS: 1700,         // длительность оборота
  BANNER_MS: 1500,        // надпись «Полный день»
  CONFETTI_MS: 1800,      // дождь мини-кадров на «Полном дне» и победе
  END_DELAY_MS: 900,      // пауза перед экраном победы/поражения
  TUT_HINT_MS: 2500,      // урок: рука появляется после стольких мс бездействия или сразу после ошибки
  IDLE_HINT_MS: 7000,     // обычный уровень: подсказка после долгого бездействия
  INTRO_MS: 3800,         // подсказка о новом элементе в начале уровня
  TOAST_MS: 1800,
};

// Детерминированный генератор (PROTO-BASE §5). Math.random() не используется нигде.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(a, rnd){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// Времена суток. Шкала главы — список по кругу: после последнего снова первое.
const TIME_NAMES = { dawn: 'рассвет', morning: 'утро', late: 'позднее утро', noon: 'полдень', day: 'день',
  golden: 'золотой час', sunset: 'закат', dusk: 'сумерки', night: 'ночь', midnight: 'полночь' };
const SCALES = {
  4:  ['morning', 'noon', 'sunset', 'night'],
  6:  ['dawn', 'morning', 'noon', 'golden', 'sunset', 'night'],
  8:  ['dawn', 'morning', 'noon', 'day', 'golden', 'sunset', 'dusk', 'night'],
  10: ['dawn', 'morning', 'late', 'noon', 'day', 'golden', 'sunset', 'dusk', 'night', 'midnight'],
};
const DAY_TIMES = ['morning', 'late', 'noon', 'day'];      // в видоискателе день — тучи на открытых кадрах расходятся
const NIGHT_TIMES = ['dusk', 'night', 'midnight'];         // в видоискателе ночь — фонари загораются

// Раскладки — формы на уровень (§5: контент — данные). Кадр задаётся (x, y, z): x — в ширинах кадра (шаг 0,5),
// y — в шагах ряда (ряд = 0,6 высоты кадра), z — глубина (больше — лежит сверху).
// Кадр A закрывает кадр B, если A выше по z и они перекрываются: |dx| < 1 и |dy| ≤ 1.
// Формы рисуются слоями-строками: символ — полкадра по ширине, строка — шаг ряда, '#' — кадр.
// dir 'down' — нижние строки лежат сверху (классика пиков), 'up' — верхние сверху; z0/x0/y0 — смещение слоя.
// peaks: P классических пиков 3-6-9-10; towers — две опоры на настиле.
const LAYOUTS = {
  lesson: { name: 'Урок', tiles: [{ x: 1, y: 0, z: 0 }, { x: 0.5, y: 1, z: 1 }, { x: 1.5, y: 1, z: 1 }, { x: 1, y: 2, z: 2 }] },  // ромб из 4
  peak1: { name: 'Пик', peaks: 1 },                     // 10 кадров, открыто 4
  peak2: { name: 'Две вершины (классика)', peaks: 2, simOnly: true },   // 19 — шире поля
  peak3: { name: 'Три пика (классика)', peaks: 3, simOnly: true },      // 28, открыто 10 — только для сверки сима с брейнштормом
  // Поле — не шире 6 кадров (CFG.FIELD_COLS): на телефоне 8 и 10 в ряд — мелко (Андрей, 29.10). Формы выше, а не шире.
  twin: { name: 'Две вершины', layers: [{ dir: 'down', rows: [    // 17: две вершины на общем основании; открыто 5
    '..#.....#..',
    '.#.#...#.#.',
    '#.#.#.#.#.#',
    '.#.#.#.#.#.'] }] },
  pyramid: { name: 'Пирамида', layers: [{ dir: 'down', rows: [    // 21: высокая пирамида 1–6; открыто 6
    '.....#.....',
    '....#.#....',
    '...#.#.#...',
    '..#.#.#.#..',
    '.#.#.#.#.#.',
    '#.#.#.#.#.#'] }] },
  bridge: { name: 'Мост', towers: [1, 4], height: 3 },   // 17: две опоры 1-2-3 вплотную, настил из 5 под ними
  sail: { name: 'Парусник', layers: [{ dir: 'down', rows: [      // 18: косой парус, кливер, корпус; открыто 6
    '.....#......',
    '.....#.#....',
    '...#.#.#.#..',
    '..#..#.#.#.#',
    '.#.#.#.#.#.#'] }] },
  diamond: { name: 'Ромб', layers: [                     // 25: пик над перевёрнутым пиком, сверху лежит средний ряд; открыто 5
    { dir: 'down', rows: ['....#....', '...#.#...', '..#.#.#..', '.#.#.#.#.', '#.#.#.#.#'] },
    { dir: 'up', y0: 5, rows: ['.#.#.#.#.', '..#.#.#..', '...#.#...', '....#....'] }] },
  sun: { name: 'Солнце', layers: [{ dir: 'down', rows: [  // 22: диск и 8 свободных лучей; открыто 10
    '.....#.....',
    '.#.......#.',
    '....#.#....',
    '...#.#.#...',
    '#.#.#.#.#.#',
    '...#.#.#...',
    '....#.#....',
    '.#.......#.',
    '.....#.....'] }] },
  heart: { name: 'Сердце', layers: [{ dir: 'up', rows: [  // 25: сверху лежат верхушки; открыто 4
    '.#.#...#.#.',
    '#.#.#.#.#.#',
    '.#.#.#.#.#.',
    '..#.#.#.#..',
    '...#.#.#...',
    '....#.#....',
    '.....#.....'] }] },
  lighthouse: { name: 'Маяк', layers: [{ dir: 'down', rows: [   // 23: фонарь на высокой башне, лучи свободны; открыто 7
    '...#.#.#...',
    '#...#.#...#',
    '....#.#....',
    '....#.#....',
    '....#.#....',
    '....#.#....',
    '...#.#.#...',
    '.#.#.#.#.#.'] }] },
  crescent: { name: 'Месяц', layers: [{ dir: 'down', rows: [    // 18: серп и две звезды
    '.......#.#.',
    '.....#.#...',
    '...#.#.....',
    '..#.#....#.',
    '..#.#......',
    '...#.#....#',
    '.....#.#...',
    '.......#.#.'] }] },
  camera: { name: 'Фотоаппарат', layers: [                // 22: корпус кирпичом, видоискатель сзади, объектив сверху
    { dir: 'down', rows: ['..#.#......'] },
    { dir: 'down', z0: 1, y0: 1, rows: ['#.#.#.#.#.#', '.#.#.#.#.#.', '#.#.#.#.#.#'] },
    { dir: 'down', z0: 10, y0: 1.5, rows: ['....#.#....', '.....#.....'] }] },
  city: { name: 'Город', layers: [{ dir: 'down', rows: [  // 18: дома разной высоты за набережной; открыто 6
    '...#.......',
    '...#...#...',
    '.#.#...#.#.',
    '.#.#.#.#.#.',
    '#.#.#.#.#.#'], y0: 2 }] },
};

// Уровни. scale — сколько времён в главе; на 10-временном режиме главы «8» идут на 10 временах, плёнка + DECK_10_EXTRA.
// seed / seed10 — сид раздачи (подобран `node sim.mjs tune` под окна побед ботов, см. DESIGN.md).
// veils — тучи и фонари: сколько и где (open — на открытых с начала, any — на любых; кадры — от сида);
// wilds — «Затмений» на старте; intro — подсказка о новом. У каждого уровня своя форма.
const LEVELS = [
  { n: 1, layout: 'lesson', scale: 8, stock: 1, tutorial: true,
    script: { tab: ['morning', 'dusk', 'night', 'sunset'], top: 'golden', stock: ['dawn'], extra: [], bonus: [] } },
  { n: 2,  layout: 'peak1',      scale: 4, stock: 4,  seed: 201 },
  { n: 3,  layout: 'sail',        scale: 4, stock: 6,  seed: 301, intro: 'gauge' },
  { n: 4,  layout: 'diamond',     scale: 6, stock: 8,  seed: 407 },
  { n: 5,  layout: 'pyramid',     scale: 6, stock: 7,  seed: 501 },
  { n: 6,  layout: 'sun',         scale: 8, stock: 9, seed: 604,  seed10: 6002,  wilds: 1, intro: 'wild' },
  { n: 7,  layout: 'heart',       scale: 8, stock: 10, seed: 1366,  seed10: 7027,  veils: { cloud: 3, where: 'open' }, intro: 'cloud' },
  { n: 8,  layout: 'bridge',      scale: 8, stock: 8, seed: 810,  seed10: 8031,  veils: { cloud: 4 } },
  { n: 9,  layout: 'lighthouse',  scale: 8, stock: 10, seed: 1492,  seed10: 9640,  veils: { lantern: 3, where: 'open' }, intro: 'lantern' },
  { n: 10, layout: 'crescent',    scale: 8, stock: 8, seed: 1010,  seed10: 10058, veils: { lantern: 4 } },
  { n: 11, layout: 'camera',      scale: 8, stock: 9, seed: 1121,  seed10: 11059, veils: { cloud: 2, lantern: 2 } },
  { n: 12, layout: 'city',        scale: 8, stock: 8, seed: 1309,  seed10: 12034, veils: { cloud: 3, lantern: 3 } },
];

const LAYOUT_CACHE = {};
function layoutTiles(D){
  if (D.tiles) return D.tiles;
  const tiles = [];
  if (D.peaks){
    const P = D.peaks, add = (x, r) => tiles.push({ x, y: r, z: r });
    for (let p = 0; p < P; p++) add(3 * p + 1.5, 0);
    for (let p = 0; p < P; p++) for (let k = 0; k < 2; k++) add(3 * p + k + 1, 1);
    for (let m = 0; m < 3 * P; m++) add(m + 0.5, 2);
    for (let i = 0; i <= 3 * P; i++) add(i, 3);
  }
  if (D.towers){
    for (let r = 0; r < D.height; r++) for (const c of D.towers) for (let i = 0; i <= r; i++) tiles.push({ x: c - r / 2 + i, y: r, z: r });
    const minX = Math.min(...tiles.map(t => t.x)), maxX = Math.max(...tiles.map(t => t.x));
    for (let x = minX + 0.5; x <= maxX - 0.5 + 1e-9; x++) tiles.push({ x, y: D.height, z: D.height });   // настил под опорами

  const pool = shuffle([...Array(lay.n).keys()].filter(ok), rnd);
  let i = 0;
  for (let c = 0; c < (veils.cloud || 0) && i < pool.length; c++) veil[pool[i++]] = 'cloud';
  for (let c = 0; c < (veils.lantern || 0) && i < pool.length; c++) veil[pool[i++]] = 'lantern';
  for (let c = 0; c < (veils.snow || 0) && i < pool.length; c++) veil[pool[i++]] = 'snow';
  return veil;
}
// Кадры со вспышкой и с дождём: сколько задаёт уровень, на какие — сид (не на кадрах под завесой).
function placeMarks(lay, count, seed, salt, veil){
  const mark = new Array(lay.n).fill(false); if (!count) return mark;
  const pool = shuffle([...Array(lay.n).keys()].filter(k => !veil[k]), mulberry32(((seed || 1) * 131 + salt) >>> 0));
  pool.slice(0, count).forEach(k => { mark[k] = true; });
  return mark;
}
// Заказ: время, кадров которого на столе больше всего (не меньше 2), снять ORDER_NEED (или сколько есть).
function makeOrder(s){
  const cnt = new Array(s.V).fill(0); for (let k = 0; k < s.lay.n; k++) if (s.present[k]) cnt[s.tab[k]]++;
  let v = 0; for (let i = 1; i < s.V; i++) if (cnt[i] > cnt[v]) v = i;
  return cnt[v] >= 2 ? { v, need: Math.min(CFG.ORDER_NEED, cnt[v]), got: 0 } : null;
}

function makeState(spec){
  const lay = buildLayout(spec.layout), ids = SCALES[spec.scale], V = ids.length, n = lay.n;
  let tab, top, stock, extra, bonus;
  if (spec.script){
    const ix = (id) => ids.indexOf(id);
    tab = spec.script.tab.map(ix); top = ix(spec.script.top); stock = spec.script.stock.map(ix);
    extra = spec.script.extra.map(ix); bonus = (spec.script.bonus || []).map(ix);
  } else {
    const ex = CFG.EXTRA_N * CFG.EXTRA_MAX, vals = dealValues(n + 1 + spec.stock + ex + CFG.BONUS_POOL, V, mulberry32(spec.seed));
    tab = vals.slice(0, n); top = vals[n]; stock = vals.slice(n + 1, n + 1 + spec.stock);
    extra = vals.slice(n + 1 + spec.stock, n + 1 + spec.stock + ex); bonus = vals.slice(n + 1 + spec.stock + ex, n + 1 + spec.stock + ex + CFG.BONUS_POOL);
  }
  const s = { li: spec.li, scale: spec.scale, ids, V, lay, tab, top, stock, extra, bonus,
    present: new Array(n).fill(true), cover: lay.initCover.slice(), left: n, veil: placeVeils(lay, spec.veils, spec.seed),
    extraLeft: Math.min(CFG.EXTRA_MAX, Math.floor(extra.length / CFG.EXTRA_N)), extraUsed: 0,
    wilds: spec.wilds || 0, wildTop: false, wildKind: null, wildsEarned: 0, wildsUsed: 0, gaugeFrames: 0, veilsCleared: 0,
    streak: 0, dir: 0, dirRun: 0, maxStreak: 0, streaks: [], moves: 0, plays: 0, draws: 0, fullDays: 0, peaks: 0,
    prize: dealValues(CFG.PRIZE_POOL, V, mulberry32(((spec.seed || 1) * 3 + 11) >>> 0)).slice(0, CFG.PRIZE_POOL),
    starsLeft: spec.stars || 0, star: null, starsCaught: 0, revealUntil: -1, flashes: 0, rainPending: false, rainbows: 0,
    ordersLeft: spec.order ? CFG.ORDER_MAX : 0, order: null, ordersDone: 0, intro: spec.intro || null, elements: spec.elements || [] };
  s.flash = placeMarks(lay, spec.flash || 0, spec.seed, 17, s.veil);
  s.rain = placeMarks(lay, spec.rain || 0, spec.seed, 29, s.veil.map((v, k) => v || s.flash[k]));
  if (s.ordersLeft) s.order = makeOrder(s);

}
function createState(li, mode){ return makeState(levelSpec(li, mode || CFG.MODE_DEFAULT)); }
function cloneState(s){ return { ...s, present: s.present.slice(), cover: s.cover.slice(), stock: s.stock.slice(), bonus: s.bonus.slice(), veil: s.veil.slice(), streaks: s.streaks.slice(),
  prize: s.prize.slice(), star: s.star && { ...s.star }, order: s.order && { ...s.order } }; }

function adjacent(a, b, V){ const d = (b - a + V) % V; return d === 1 || d === V - 1; }
function gaugeHalf(s){ return CFG.GAUGE_EVERY || Math.ceil(s.V / 2); }   // столько ходов в одну сторону — кадр на плёнку
function veilKey(s, v){ const id = s.ids[v]; return DAY_TIMES.includes(id) ? 'cloud' : NIGHT_TIMES.includes(id) ? 'lantern' : null; }
// Какие завесы снимает время v: день — тучи, полдень — ещё и снег, ночь — фонари.
function veilKinds(s, v){ const k = veilKey(s, v), out = k ? [k] : []; if (s.ids[v] === 'noon') out.push('snow'); return out; }
// Пока в видоискателе день — туч на открытых кадрах нет; ночь — фонари горят; полдень — снег тает. Вызывается после каждого действия.
function applyVeils(s){
  if (s.wildTop) return [];
  const kinds = veilKinds(s, s.top); if (!kinds.length) return [];
  const out = [];
  for (let k = 0; k < s.lay.n; k++) if (kinds.includes(s.veil[k]) && s.present[k] && s.cover[k] === 0){ s.veil[k] = null; out.push(k); }
  s.veilsCleared += out.length;
  return out;
}
function isOpen(s, k){ return s.present[k] && s.cover[k] === 0; }
function exposed(s){ const e = []; for (let k = 0; k < s.lay.n; k++) if (s.present[k] && s.cover[k] === 0) e.push(k); return e; }
// Что будет от тапа по кадру k: ok — ход; same — тот же час; skip — через ступень и дальше; veiled — под тучей или фонарём;
// covered — закрыт; gone — снят.
function classify(s, k){
  if (!s.present[k]) return 'gone';
  if (s.cover[k]) return 'covered';
  if (s.veil[k]) return 'veiled';
  if (s.wildTop) return 'ok';
  if (s.tab[k] === s.top) return 'same';
  return adjacent(s.top, s.tab[k], s.V) ? 'ok' : 'skip';
}
function playable(s){ return exposed(s).filter(k => classify(s, k) === 'ok'); }
function canWild(s){ return s.wilds > 0 && !s.wildTop && exposed(s).some(k => !s.veil[k]); }
function canStar(s){ return !!s.star && s.prize.length > 0; }
function isRevealed(s){ return s.moves < s.revealUntil; }   // вспышка ещё действует: закрытые кадры видны
function givePrize(s, n){ let g = 0; for (; g < n && s.prize.length; g++) s.stock.push(s.prize.shift()); return g; }
function legalMoves(s){ const m = playable(s); if (s.stock.length) m.push('draw'); if (canWild(s)) m.push('wild'); if (canStar(s)) m.push('star'); if (canExtra(s)) m.push('extra'); return m; }

// Звезда гаснет через STAR_MOVES действий (тап по звезде действием не считается).
function tickStar(s){ if (!s.star) return false; if (--s.star.left > 0) return false; s.star = null; return true; }
// Одно действие, мутирует состояние: номер кадра | 'draw' | 'wild' | 'star' | 'extra'. Возвращает событие для оболочки или null.
function step(s, act){
  if (act === 'star'){                                         // поймать падающую звезду: кадры на плёнку, хода не тратит
    if (!canStar(s)) return null;
    const n = givePrize(s, CFG.STAR_FRAMES); s.star = null; s.starsCaught++;
    return { kind: 'star', n };
  }
  if (act === 'draw'){
    if (!s.stock.length) return null;
    const broke = s.streak, starGone = tickStar(s);
    if (s.streak) s.streaks.push(s.streak);
    s.streak = 0; s.dir = 0; s.dirRun = 0; s.wildTop = false; s.wildKind = null;
    s.top = s.stock.shift(); s.draws++; s.moves++;
    return { kind: 'draw', v: s.top, broke, starGone, cleared: applyVeils(s) };
  }
  if (act === 'wild'){
    if (!canWild(s)) return null;
    const starGone = tickStar(s);
    s.wilds--; s.wildsUsed++; s.wildTop = true; s.wildKind = 'eclipse'; s.moves++;
    return { kind: 'wild', starGone };
  }
  if (act === 'extra'){
    if (!canExtra(s)) return null;
    s.stock = s.extra.slice(s.extraUsed * CFG.EXTRA_N, (s.extraUsed + 1) * CFG.EXTRA_N);
    s.extraUsed++; s.extraLeft--;
    return { kind: 'extra', n: s.stock.length };
  }
  const k = act;
  if (classify(s, k) !== 'ok') return null;
  const prev = s.top, v = s.tab[k], wasWild = s.wildTop, revealed = [], starGone = tickStar(s);
  s.present[k] = false; s.left--;
  for (const x of s.lay.covers[k]){ s.cover[x]--; if (s.cover[x] === 0 && s.present[x]) revealed.push(x); }
  let dir = 0, fullDay = false, gaugeFrame = false, wildEarned = false;
  if (!wasWild){                                              // ход на «Затмение» шкалу не двигает и не рвёт
    dir = (v - prev + s.V) % s.V === 1 ? 1 : -1;
    if (dir === s.dir) s.dirRun++; else { s.dir = dir; s.dirRun = 1; }
    if (CFG.GAUGE_ON && s.dirRun % gaugeHalf(s) === 0 && s.dirRun < s.V && s.bonus.length){ s.stock.push(s.bonus.shift()); s.gaugeFrames++; gaugeFrame = true; }
    if (s.dirRun >= s.V){                                     // «Полный день»: V ходов подряд в одну сторону
      fullDay = true; s.fullDays++; s.dirRun = 0;
      if (CFG.GAUGE_ON && s.wilds < CFG.WILD_MAX){ s.wilds++; s.wildsEarned++; wildEarned = true; }
    }
  }
  s.top = v; s.wildTop = false; s.wildKind = null; s.streak++; s.plays++; s.moves++;
  if (s.streak > s.maxStreak) s.maxStreak = s.streak;
  const peak = s.lay.tops.includes(k);
  if (peak) s.peaks++;
  const id = s.ids[v];
  // вспышка: закрытые кадры видны FLASH_MOVES действий
  let flash = false; if (s.flash[k]){ s.revealUntil = s.moves + CFG.FLASH_MOVES; s.flashes++; flash = true; }
  // дождь → радуга: кадр с дождём заряжает радугу, следующий дневной ход становится радугой — к ней подходит любой кадр
  let rainStart = false, rainbow = false;
  if (s.rain[k]){ s.rainPending = true; rainStart = true; }
  else if (s.rainPending && !wasWild && DAY_TIMES.includes(id)){ s.rainPending = false; s.wildTop = true; s.wildKind = 'rainbow'; s.rainbows++; rainbow = true; }
  // заказ: сними ORDER_NEED кадров одного времени — кадры на плёнку, потом следующий заказ
  let orderDone = null;
  if (s.order && v === s.order.v && ++s.order.got >= s.order.need){
    orderDone = { v, n: givePrize(s, CFG.ORDER_FRAMES) }; s.ordersDone++; s.ordersLeft--;
    s.order = s.ordersLeft > 0 ? makeOrder(s) : null;
  }
  // падающая звезда: серия привела в ночь
  let starSpawn = false;
  if (!s.star && s.starsLeft > 0 && s.streak >= CFG.STAR_STREAK && NIGHT_TIMES.includes(id)){ s.star = { left: CFG.STAR_MOVES }; s.starsLeft--; starSpawn = true; }
  return { kind: 'play', k, v, prev, dir, wasWild, fullDay, gaugeFrame, wildEarned, peak, revealed, cleared: applyVeils(s), streak: s.streak,
    flash, rainStart, rainbow, orderDone, starSpawn, starGone };
}
function applyMove(s, act){ const n = cloneState(s); n.ev = step(n, act); return n; }

function isWin(s){ return s.left === 0; }
function isStuck(s){ return s.left > 0 && !s.stock.length && !playable(s).length && !canWild(s) && !canStar(s); }
function canExtra(s){ return isStuck(s) && s.extraLeft > 0 && s.left <= CFG.NEAR_WIN; }
function isLose(s){ return isStuck(s) && !canExtra(s); }

// --- полный перебор с открытыми картами (аудит: раздача вообще проходима без «+3») ---
// Возвращает список действий, null — нерешаемо, undefined — превышен предел узлов. «Затмение» — только когда хода нет.
function solve(s0){
  const dead = new Set(), path = []; let nodes = 0, over = false;
  const key = (s) => {
    let m = 0, vb = 0;
    for (let k = 0; k < s.lay.n; k++){ if (!s.present[k]) m += 2 ** k; if (s.veil[k]) vb += 2 ** k; }
    return m + ':' + vb + ':' + s.stock.length + ':' + s.bonus.length + ':' + s.top + ':' + s.dir + ':' + s.dirRun + ':' + s.wilds + ':' + (s.wildTop ? 1 : 0) +
      ':' + (s.star ? s.star.left : 0) + ':' + s.starsLeft + ':' + s.prize.length + ':' + (s.rainPending ? 1 : 0) + ':' + (s.order ? s.order.v + '/' + s.order.got : '-') + ':' + s.ordersLeft;
  };
  function rec(s){
    if (isWin(s)) return true;
    if (++nodes > CFG.SOLVE_NODES){ over = true; return false; }
    const kk = key(s); if (dead.has(kk)) return false;
    const pl = playable(s), opts = canStar(s) ? ['star'] : pl.slice();     // звезду ловим сразу: это бесплатно
    if (!canStar(s)){ if (s.stock.length) opts.push('draw'); if (!pl.length && canWild(s)) opts.push('wild'); }
    for (const a of opts){
      const t = cloneState(s); step(t, a); path.push(a);
      if (rec(t)) return true;
      path.pop(); if (over) return false;
    }
    dead.add(kk); return false;
  }
  const ok = rec(cloneState(s0));
  return ok ? path.slice() : over ? undefined : null;
}

// --- боты (PROTO-BASE §6): случайный, жадный, планировщик ---
// random  — случайный разрешённый ход, добор только когда хода нет (новичок «тыкаю в подходящее»);
// greedy  — видит только открытые кадры: больше подходящих после хода, шанс на открытие, держит направление шкалы,
//           ведёт время к тучам и фонарям; «Затмение» бережёт до конца плёнки;
// plan    — на каждой развилке PLAN_N прогонов до конца на случайной расстановке неизвестного (закрытые, плёнка, запас шкалы).
function newlyExposed(s, k){ let c = 0; for (const x of s.lay.covers[k]) if (s.present[x] && s.cover[x] === 1) c++; return c; }
function greedyScore(s, k, ex){
  const nt = s.tab[k], vk = veilKey(s, nt), p = 2 / s.V; let known = 0, veilB = 0;
  for (const q of ex){
    if (q === k) continue;
    if (s.veil[q] === vk && vk) veilB += 0.7;
    if ((!s.veil[q] || s.veil[q] === vk) && adjacent(nt, s.tab[q], s.V)) known++;
  }
  let dirB = 0;
  if (CFG.GAUGE_ON && !s.wildTop){ const d = (nt - s.top + s.V) % s.V === 1 ? 1 : -1; if (s.dir === 0 || d === s.dir) dirB = 0.35 * Math.min(1, (s.dirRun + 1) / gaugeHalf(s)); }
  const id = s.ids[nt];
  if (id === 'noon') for (const q of ex) if (q !== k && s.veil[q] === 'snow') veilB += 0.7;
  let elB = 0;
  if (s.order && nt === s.order.v) elB += 0.6;
  if (s.rainPending && DAY_TIMES.includes(id)) elB += 0.5;
  if (!s.star && s.starsLeft > 0 && s.streak + 1 >= CFG.STAR_STREAK && NIGHT_TIMES.includes(id)) elB += 0.4;
  if (s.flash[k]) elB += 0.3;
  return known + newlyExposed(s, k) * p + dirB + veilB + elB;
}
function greedyPick(s, pl, rnd){
  const ex = exposed(s);
  let best = pl[0], bs = -1e9;
  for (const k of pl){ const sc = greedyScore(s, k, ex) + rnd() * 1e-3; if (sc > bs){ bs = sc; best = k; } }
  return best;
}
function determinize(s, rnd){
  const t = cloneState(s); t.tab = s.tab.slice();
  const idx = [], vals = [];
  const rev = isRevealed(s);                                   // при вспышке закрытые кадры известны — их не перемешиваем
  for (let k = 0; k < s.lay.n; k++) if (!rev && s.present[k] && s.cover[k] > 0){ idx.push(k); vals.push(s.tab[k]); }
  for (const v of s.stock) vals.push(v);
  for (const v of s.bonus) vals.push(v);
  shuffle(vals, rnd);
  idx.forEach((k, i) => { t.tab[k] = vals[i]; });
  t.stock = vals.slice(idx.length, idx.length + s.stock.length);
  t.bonus = vals.slice(idx.length + s.stock.length);
  return t;
}
// Прогон жадным до конца: >0 — победа (1 + остаток плёнки), <0 — проигрыш (минус оставшиеся кадры).
function rollout(t, rnd){
  while (true){
    if (t.left === 0) return 1 + t.stock.length * 0.01;
    if (canStar(t)){ step(t, 'star'); continue; }
    const pl = playable(t);
    if (pl.length) step(t, greedyPick(t, pl, rnd));
    else if (t.stock.length) step(t, 'draw');
    else if (canWild(t)) step(t, 'wild');
    else return -t.left * 0.01;
  }
}
// Средняя оценка каждого варианта по n прогонам (общие расстановки неизвестного для всех вариантов).
function optionValues(s, opts, rnd, n){
  const score = opts.map(() => 0), wins = opts.map(() => 0);
  for (let i = 0; i < n; i++){
    const base = determinize(s, rnd);
    opts.forEach((a, j) => { const t = cloneState(base); step(t, a); const r = rollout(t, rnd); score[j] += r; if (r > 0) wins[j]++; });
  }
  return { score, wins };
}
function planChoose(s, opts, rnd){
  if (opts.length === 1) return opts[0];
  const { score } = optionValues(s, opts, rnd, CFG.PLAN_N);
  let bj = 0; for (let j = 1; j < opts.length; j++) if (score[j] > score[bj]) bj = j;
  return opts[bj];
}
function planPick(s, pl, rnd){ return planChoose(s, pl, rnd); }
// Варианты решения: ходы на поле; если хода нет — плёнка и/или «Затмение».
function decisionOptions(s){
  const pl = playable(s); if (pl.length) return pl;
  const o = []; if (s.stock.length) o.push('draw'); if (canWild(s)) o.push('wild');
  return o;
}
function botPick(s, bot, rnd){
  if (canStar(s)) return 'star';                               // звезду ловят все боты: это бесплатно
  const pl = playable(s);
  if (pl.length){
    if (bot === 'random') return pl[Math.floor(rnd() * pl.length)];
    if (bot === 'greedy') return greedyPick(s, pl, rnd);
    return planPick(s, pl, rnd);
  }
  if (bot === 'plan' && s.stock.length && canWild(s)) return planChoose(s, ['draw', 'wild'], rnd);
  if (s.stock.length) return 'draw';
  return canWild(s) ? 'wild' : null;
}
// Прогон бота до конца партии. opt.extra — брать «+3» на почти-победе. Возвращает исход и метрики ощущения.
function runBot(s, bot, seed, opt){
  opt = opt || {}; const rnd = mulberry32(seed);
  const m = { decisions: 0, open: 0, play: 0, noMove: 0, sameTempt: 0, taps: 0, firstPeakTap: 0, firstJuiceTap: 0, usedExtra: 0, winNoExtra: false };
  while (true){
    if (isWin(s)) break;
    const ex = exposed(s), pl = playable(s);
    m.decisions++; m.open += ex.length; m.play += pl.length;
    if (!pl.length) m.noMove++;
    if (!s.wildTop && ex.some(k => !s.veil[k] && s.tab[k] === s.top)) m.sameTempt++;
    const act = botPick(s, bot, rnd);
    if (act === null){
      if (opt.extra && canExtra(s)){ step(s, 'extra'); m.usedExtra++; continue; }
      break;
    }
    const ev = step(s, act); if (act !== 'star') m.taps++;
    if (ev.kind === 'play'){
      if (ev.peak && !m.firstPeakTap) m.firstPeakTap = m.taps;
      if (!m.firstJuiceTap && (ev.peak || ev.fullDay || ev.gaugeFrame || ev.streak >= CFG.JUICE_STREAK)) m.firstJuiceTap = m.taps;
    }
  }
  const streaks = s.streaks.concat(s.streak ? [s.streak] : []);
  return Object.assign(m, { win: isWin(s), winNoExtra: isWin(s) && !m.usedExtra, left: s.left, plays: s.plays, draws: s.draws,
    streaks, maxStreak: s.maxStreak, fullDays: s.fullDays, peaks: s.peaks, stockLeft: s.stock.length, moves: s.moves,
    gaugeFrames: s.gaugeFrames, wildsEarned: s.wildsEarned, wildsUsed: s.wildsUsed, veilsCleared: s.veilsCleared,
    starsCaught: s.starsCaught, flashes: s.flashes, rainbows: s.rainbows, ordersDone: s.ordersDone });
}
function randomRun(li, seed, opt){ opt = opt || {}; return runBot(createState(li, opt.mode), 'random', seed, opt); }
function greedyRun(li, seed, opt){ opt = opt || {}; return runBot(createState(li, opt.mode), 'greedy', seed === undefined ? 1 : seed, opt); }
function planRun(li, seed, opt){ opt = opt || {}; return runBot(createState(li, opt.mode), 'plan', seed, opt); }

// --- Арт (§1, §11): панорамы залива нарисованы GPT — одна композиция, 10 вариантов света; спрайты — тоже GPT. ---

};
const IMG = {};                             // pano:<id>, sprite:<имя>, lanternOff; EDGE[id] — цвет верхней и нижней кромки панорамы
const EDGE = {};
function loadArt(){
  const one = (key, src, done) => { const im = new Image(); im.onload = () => { IMG[key] = im; if (done) done(im); log('event', 'art.load', key); };
    im.onerror = () => log('event', 'art.fail', key + ' ' + src); im.src = src; };
  for (const id in ART.PANO) one('pano:' + id, ART.PANO[id], (im) => { EDGE[id] = edgeColors(im, id); for (const k in PHOTO_CACHE) if (k.startsWith(id + ':')) delete PHOTO_CACHE[k]; });
  for (const n in ART.SPRITE) one('sprite:' + n, ART.SPRITE[n], (im) => { if (n === 'lantern') IMG.lanternOff = tinted(im, 'rgba(16,20,34,0.62)'); if (n === 'eclipse') IMG['sprite:eclipse'] = defringe(im); });
}
// Цвет кромок панорамы: им заливаются полосы выше и ниже картинки на высоких экранах. Без доступа к пикселям — палитра LIGHT.
function edgeColors(im, id){
  try {
    const c = document.createElement('canvas'); c.width = 8; c.height = 64; const x = c.getContext('2d');
    x.drawImage(im, 0, 0, 8, 64); const d = x.getImageData(0, 0, 8, 64).data, avg = (row) => { let r = 0, g = 0, b = 0; for (let i = 0; i < 8; i++){ const a = (row * 8 + i) * 4; r += d[a]; g += d[a + 1]; b += d[a + 2]; } return [r / 8, g / 8, b / 8]; };
    return { top: avg(0), bot: avg(63) };
  } catch (e) { return { top: hex(LIGHT[id].top), bot: hex(LIGHT[id].wBot) }; }
}
function tinted(im, fill){ const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = fill; x.fillRect(0, 0, c.width, c.height); return c; }
// У спрайта затмения по краю короны остался красный ореол от вырезки фона — перекрашиваем полупрозрачные красные пиксели в цвет короны.
function defringe(im){
  try {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    const D = x.getImageData(0, 0, c.width, c.height), d = D.data;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] < 250 && d[i] > d[i + 1] * 1.35){ d[i] = 255; d[i + 1] = 196; d[i + 2] = 120; d[i + 3] = Math.min(d[i + 3], 140); }
    x.putImageData(D, 0, 0); return c;
  } catch (e) { return im; }
}

  late:     { top: '#4a9ff0', mid: '#93cdf8', bot: '#e2f4ff', wTop: '#9fd2f0', wBot: '#2f6fb0', city: '#60789a', sunCol: '#ffffff', glow: '#fffbe0', sunA: 62,  sunS: 0.9,  sunVis: 1,   moonA: 215, moonVis: 0,    win: 0,    stars: 0,    refl: 0.45 },
  noon:     { top: '#1440c4', mid: '#2a78e4', bot: '#8ccfff', wTop: '#2b86da', wBot: '#0b2c74', city: '#33466a', sunCol: '#ffffff', glow: '#fffde6', sunA: 90,  sunS: 0.8,  sunVis: 1,   moonA: 230, moonVis: 0,    win: 0,    stars: 0,    refl: 0.6 },
  day:      { top: '#139aa6', mid: '#45cdbb', bot: '#e0f6c2', wTop: '#3cc3ae', wBot: '#0b5866', city: '#2a5858', sunCol: '#fffbe0', glow: '#fff09c', sunA: 126, sunS: 0.95, sunVis: 1,   moonA: 250, moonVis: 0,    win: 0,    stars: 0,    refl: 0.5 },

  night:    { top: '#060a22', mid: '#12225a', bot: '#2c3d7c', wTop: '#1c2c62', wBot: '#040714', city: '#0a0c1e', sunCol: '#ffffff', glow: '#ffffff', sunA: 270, sunS: 1,    sunVis: 0,   moonA: 52,  moonVis: 1,    win: 1,    stars: 1,    refl: 0.8 },
  midnight: { top: '#020308', mid: '#060a1c', bot: '#10162e', wTop: '#0c1430', wBot: '#020306', city: '#050610', sunCol: '#ffffff', glow: '#ffffff', sunA: 300, sunS: 1,    sunVis: 0,   moonA: 98,  moonVis: 1,    win: 0.35, stars: 1.25, refl: 0.6 },
};
const WINDOW_COL = [255, 210, 122];       // свет в окнах (процедурный мир)
const MOON_COL = [246, 242, 220];
const COLOR_KEYS = ['top', 'mid', 'bot', 'wTop', 'wBot', 'city', 'sunCol', 'glow'];
const NUM_KEYS = ['sunA', 'sunS', 'sunVis', 'moonA', 'moonVis', 'win', 'stars', 'refl'];
function hex(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(c, a){ return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a === undefined ? 1 : a) + ')'; }
const LP = {};                              // LIGHT в числах: цвета — [r,g,b]
for (const id in LIGHT){ const L = LIGHT[id], p = {}; COLOR_KEYS.forEach(k => { p[k] = hex(L[k]); }); NUM_KEYS.forEach(k => { p[k] = L[k]; }); LP[id] = p; }
function mixP(a, b, t){
  const p = {};
  for (const k of COLOR_KEYS) p[k] = [a[k][0] + (b[k][0] - a[k][0]) * t, a[k][1] + (b[k][1] - a[k][1]) * t, a[k][2] + (b[k][2] - a[k][2]) * t];
  for (const k of NUM_KEYS) p[k] = a[k] + (b[k] - a[k]) * t;
  return p;
}
// Ближайший к a угол, равный b по модулю 360, в нужную сторону: dir +1 — вперёд, -1 — назад, 0 — кратчайший.
function unwrapTo(a, b, dir){
  let d = (((b - a) % 360) + 360) % 360;
  if (dir < 0 && d > 0) d -= 360; else if (dir === 0 && d > 180) d -= 360;
  return a + d;
}
const easeOut = (t) => 1 - (1 - t) * (1 - t) * (1 - t);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = (t) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function mixC(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
const fxRnd = mulberry32(31337);          // разброс частиц и конфетти — тоже от сида (§5)

// --- Запасной процедурный мир (если панорама не загрузилась): небо, город с мостом, залив. ---
// Силуэт города: здания и окна, нормированные (x — доля ширины кадра, y и h — доля высоты города над горизонтом).
function makeSkyline(seed){
  const r = mulberry32(seed), b = [], win = [];
  b.push({ x0: 0, x1: 0.07, h: 0.07, kind: 'flat' }, { x0: 0.07, x1: 0.15, h: 0.12, kind: 'flat' });   // низкий берег
  let x = 0.17;
  while (x < 0.62){
    const bw = 0.03 + r() * 0.04, hump = 1 - Math.abs(x - 0.4) * 2.2;
    const bh = clamp(0.22 + r() * 0.5 + hump * 0.35, 0.18, 1);
    const kind = r() < 0.14 ? 'spire' : r() < 0.2 ? 'step' : 'flat';
    b.push({ x0: x, x1: x + bw, h: bh, kind });
    const cols = Math.max(1, Math.floor(bw / 0.013)), rows = Math.floor((bh - 0.06) / 0.085);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) win.push({ x: x + (i + 0.5) * bw / cols, y: 0.07 + j * 0.085, th: r(), b: b.length - 1 });
    x += bw + (r() < 0.25 ? 0.006 : 0);
  }
  return { b, win };
}
const SKYLINE = makeSkyline(20261029);
const STARS = (() => { const r = mulberry32(777), out = []; for (let i = 0; i < 70; i++) out.push({ x: r(), y: r() * 0.85, s: 0.6 + r() * 1.1, ph: r() * 6.28 }); return out; })();
function drawWorld(c, R, P, now){
  const g = c.createLinearGradient(0, R.y, 0, R.hor);
  g.addColorStop(0, rgba(P.top)); g.addColorStop(0.6, rgba(P.mid)); g.addColorStop(1, rgba(P.bot));
  c.fillStyle = g; c.fillRect(R.x, R.y, R.w, R.hor - R.y + 1);
  if (P.stars > 0.02) for (const S of STARS){
    const a = clamp(P.stars * (R.mini ? 1 : 0.65 + 0.35 * Math.sin(now / 600 + S.ph)), 0, 1); if (a < 0.03) continue;
    c.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')'; const sz = R.mini ? Math.max(1, R.w / 60) * S.s * 0.8 : S.s * 1.3;
    c.fillRect(R.x + S.x * R.w, R.y + S.y * (R.hor - R.y) * 0.9, sz, sz);
  }
  const cw = R.w, ch = R.cityH, base = R.hor;
  c.fillStyle = rgba(P.city);
  for (const B of SKYLINE.b){
    const x0 = R.x + B.x0 * cw, x1 = R.x + B.x1 * cw, top = base - B.h * ch;
    c.fillRect(x0, top, x1 - x0 + 0.6, base - top + 0.5);
    if (B.kind === 'spire'){ c.beginPath(); c.moveTo(x0 + (x1 - x0) * 0.3, top); c.lineTo((x0 + x1) / 2, top - ch * 0.22); c.lineTo(x0 + (x1 - x0) * 0.7, top); c.fill(); }
  }
  const t1 = R.x + 0.74 * cw, t2 = R.x + 0.93 * cw, th = ch * 0.92, deck = base - ch * 0.16, tw = Math.max(1, ch * 0.055);
  c.fillRect(R.x + 0.6 * cw, deck, 0.4 * cw, Math.max(1, ch * 0.04)); c.fillRect(t1 - tw / 2, base - th, tw, th); c.fillRect(t2 - tw / 2, base - th, tw, th);
  if (P.win > 0.01){
    c.fillStyle = rgba(WINDOW_COL, 0.95); const ww = Math.max(1, cw * 0.005), wh = Math.max(1, ch * 0.04), stp = R.mini ? 3 : 1;
    for (let i = 0; i < SKYLINE.win.length; i += stp){ const Wn = SKYLINE.win[i]; if (Wn.th < P.win) c.fillRect(R.x + Wn.x * cw - ww / 2, base - Wn.y * ch - wh, ww, wh); }
  }
  const gw = c.createLinearGradient(0, R.hor, 0, R.y + R.h);
  gw.addColorStop(0, rgba(P.wTop)); gw.addColorStop(1, rgba(P.wBot));
  c.fillStyle = gw; c.fillRect(R.x, R.hor, R.w, R.y + R.h - R.hor);
}

// --- Мир: панорама текущего времени (на переходе — перетекание двух), поверх — солнце и луна на дуге. ---
// R — рамка сцены: x, y, w, h, hor (y горизонта), cx/rx/ry (эллипс дуги светил), sunR, moonR, crop (доли ширины панорамы), mini.
function drawPano(c, R, id, alpha){
  const im = IMG['pano:' + id]; if (!im || alpha <= 0) return false;
  const sx0 = R.crop[0] * im.width, sw = (R.crop[1] - R.crop[0]) * im.width, k = R.w / sw, ih = im.height * k, top = R.hor - ART.HORIZON * ih;
  const E = EDGE[id] || { top: hex(LIGHT[id].top), bot: hex(LIGHT[id].wBot) };
  c.globalAlpha = alpha;
  // выше и ниже картинки тянем её крайние строки — без шва; EDGE — подстраховка, если строки не дотянулись
  if (top > R.y){ c.fillStyle = rgba(E.top); c.fillRect(R.x, R.y, R.w, top - R.y + 1); c.drawImage(im, sx0, 0, sw, 2, R.x, R.y, R.w, top - R.y + 1); }
  if (top + ih < R.y + R.h){ c.fillStyle = rgba(E.bot); c.fillRect(R.x, top + ih - 1, R.w, R.y + R.h - top - ih + 1); c.drawImage(im, sx0, im.height - 2, sw, 2, R.x, top + ih - 1, R.w, R.y + R.h - top - ih + 1); }
  c.drawImage(im, sx0, 0, sw, im.height, R.x, top, R.w, ih);
  c.globalAlpha = 1;
  return true;
}
function skylineClip(c, R){
  const im = IMG['pano:golden'] || IMG['pano:noon'], k = im ? R.w / ((R.crop[1] - R.crop[0]) * im.width) : 0, ih = im ? im.height * k : R.h;
  c.beginPath(); c.moveTo(R.x - 1, R.y - 1); c.lineTo(R.x + R.w + 1, R.y - 1);
  for (let i = ART.SKYLINE.length - 1; i >= 0; i--){
    const [xf, hf] = ART.SKYLINE[i], x = R.x + (xf - R.crop[0]) / (R.crop[1] - R.crop[0]) * R.w;
    c.lineTo(x, R.hor - hf * ih);
  }
  c.closePath(); c.clip();
}
function arcPos(R, a){ const r = a * Math.PI / 180; return { x: R.cx - R.rx * Math.cos(r), y: R.hor - R.ry * Math.sin(r), up: Math.sin(r) }; }
// Серп луны — заранее нарисованный спрайт: диск минус смещённый круг (прозрачная тень, сквозь неё видно небо).
const MOON_SPRITE = (() => {
  const c = document.createElement('canvas'), n = 96; c.width = c.height = n; const x = c.getContext('2d');
  x.fillStyle = rgba(MOON_COL); x.beginPath(); x.arc(n / 2, n / 2, n * 0.46, 0, 6.2832); x.fill();
  x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(n / 2 - n * 0.2, n / 2 - n * 0.1, n * 0.4, 0, 6.2832); x.fill();
  return c;
})();
function drawLights(c, R, P, now){
  const sky = () => { c.beginPath(); c.rect(R.x, R.y, R.w, R.hor - R.y); c.clip(); };
  if (P.moonVis > 0.01){
    const p = arcPos(R, P.moonA), r = R.moonR;
    if (p.up > -0.1){
      c.save(); sky(); c.globalCompositeOperation = 'screen';
      const g = c.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r * 4.5);
      g.addColorStop(0, rgba([200, 215, 255], 0.38 * P.moonVis)); g.addColorStop(1, rgba([200, 215, 255], 0));
      c.fillStyle = g; c.fillRect(p.x - r * 5, p.y - r * 5, r * 10, r * 10); c.restore();
      c.save(); skylineClip(c, R); c.globalAlpha = P.moonVis; c.drawImage(MOON_SPRITE, p.x - r * 1.1, p.y - r * 1.1, r * 2.2, r * 2.2); c.restore();
    }
  }
  if (P.sunVis > 0.01){
    const p = arcPos(R, P.sunA), r = R.sunR * P.sunS;
    if (p.y < R.hor + r * 6){
      c.save(); sky(); c.globalCompositeOperation = 'screen';
      const g = c.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, r * 5.5);
      g.addColorStop(0, rgba(P.glow, 0.75 * P.sunVis)); g.addColorStop(0.3, rgba(P.glow, 0.28 * P.sunVis)); g.addColorStop(1, rgba(P.glow, 0));
      c.fillStyle = g; c.fillRect(p.x - r * 6, p.y - r * 6, r * 12, r * 12); c.restore();
      c.save(); skylineClip(c, R); c.fillStyle = rgba(P.sunCol, P.sunVis); c.beginPath(); c.arc(p.x, p.y, r, 0, 6.2832); c.fill(); c.restore();
    }
  }

  const span = R.y + R.h - R.hor, len = span * 0.55, rows = 26;
  c.save(); c.globalCompositeOperation = 'screen';
  const lights = [];
  if (P.sunVis > 0.01){ const p = arcPos(R, P.sunA); if (p.up > -0.08) lights.push({ x: p.x, col: P.sunCol, a: P.refl * P.sunVis * clamp(1.15 - p.up, 0.3, 1), w: R.sunR * P.sunS }); }
  if (P.moonVis > 0.01){ const p = arcPos(R, P.moonA); if (p.up > 0) lights.push({ x: p.x, col: MOON_COL, a: P.refl * P.moonVis * 0.5, w: R.moonR }); }

    const f = i / rows, y = R.hor + 2 + f * len, tw = 0.5 + 0.5 * Math.sin(i * 12.9898 + now / 260 + i * 0.7);
    const w = L.w * (2.2 - 1.4 * f) * (0.3 + 0.7 * tw);

function drawScene(c, R, A, B, t, P, now){

// Фото на полароиде: квадрат из панорамы того же времени + светило на своём месте. Кешируется по (время, пиксели устройства).

function photo(id, px){

    const v = c.createRadialGradient(px / 2, px / 2, px * 0.35, px / 2, px / 2, px * 0.75);   // лёгкая виньетка плёнки

function rr(c, x, y, w, h, r){ c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }
// Полароид: рамка, квадратное фото, нижнее поле шире. dev 0..1 — проявленность (закрытый кадр — тёмная эмульсия).
// o: scale/sx/sy — масштаб, lift — подъём (тень дальше), ring — обводка, tint — красная вспышка ошибки, veil — туча/фонарь {kind, a, t}.
function drawPolaroid(c, cx, cy, w, rot, id, dev, o){
  o = o || {};

  c.save(); c.translate(cx, cy); c.rotate(rot);

  c.fillStyle = 'rgba(0,0,0,' + sh.toFixed(3) + ')'; rr(c, -w / 2 + w * 0.02, -h / 2 + w * (0.04 + lift * 0.08), w, h, w * 0.04); c.fill();
  const pg = c.createLinearGradient(0, -h / 2, 0, h / 2); pg.addColorStop(0, '#fffdf7'); pg.addColorStop(1, '#efe9dc');
  c.fillStyle = o.frame || pg; rr(c, -w / 2, -h / 2, w, h, w * 0.04); c.fill();
  const px = -w / 2 + m, py = -h / 2 + m;
  if (dev < 1){
    const g = c.createLinearGradient(px, py, px + ps, py + ps); g.addColorStop(0, '#46403a'); g.addColorStop(1, '#221f1c');
    c.fillStyle = g; c.fillRect(px, py, ps, ps);
  }
  if (dev > 0 && id){ c.globalAlpha = dev; c.drawImage(photo(id, (o.photoPx || ps) * scale * DPR), px, py, ps, ps); c.globalAlpha = 1; }
  if (o.veil) drawVeil(c, o.veil, px, py, ps);
  if (o.tint){ c.fillStyle = 'rgba(255,70,60,' + o.tint.toFixed(3) + ')'; c.fillRect(px, py, ps, ps); }
  // блик глянца
  const gl = c.createLinearGradient(px, py, px + ps, py + ps); gl.addColorStop(0, 'rgba(255,255,255,0.16)'); gl.addColorStop(0.45, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,0)');

// Метка на нижнем поле полароида: лампа-вспышка или капли дождя.
function drawMark(c, kind, x, y, w, now){
  const r = w * 0.085;
  if (kind === 'flash'){
    const pul = 1 + 0.15 * Math.sin(now / 220);
    c.fillStyle = 'rgba(255,230,120,0.55)'; c.beginPath(); c.arc(x, y, r * 1.9 * pul, 0, 6.2832); c.fill();
    c.fillStyle = '#fff6c8'; c.beginPath(); c.arc(x, y - r * 0.15, r, 0, 6.2832); c.fill();
    c.fillStyle = '#8a7a60'; c.fillRect(x - r * 0.45, y + r * 0.7, r * 0.9, r * 0.6);
  } else {
    c.fillStyle = '#4a8fe0';

// Завеса на фото: туча (днём расходится в стороны) или тёмный кадр с фонарём (ночью фонарь загорается, тьма уходит).
// a — сила завесы 1..0 (0 — сошла), t — время для покачивания.
function drawVeil(c, V, px, py, ps){
  const a = V.a, t = V.t || 0;
  c.save(); c.beginPath(); c.rect(px - ps * 0.25, py - ps * 0.25, ps * 1.5, ps * 1.5); c.clip();
  if (V.kind === 'cloud'){
    c.fillStyle = 'rgba(226,232,246,' + (0.55 * a).toFixed(3) + ')'; c.fillRect(px, py, ps, ps);
    const sp = IMG['sprite:cloud'], cw = ps * 1.5, ch = cw * 0.55, bob = Math.sin(t / 700) * ps * 0.03, off = (1 - a) * ps * 0.7;
    if (sp){
      c.globalAlpha = a;

        c.save(); c.beginPath(); c.rect(side < 0 ? px - ps : px + ps / 2, py - ps, ps * 1.5, ps * 3); c.clip();
        c.drawImage(sp, 0, sp.height * 0.28, sp.width, sp.height * 0.46, px + ps / 2 - cw / 2 + side * off, py + ps * 0.5 - ch / 2 + bob, cw, ch);

    } else { c.fillStyle = 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')'; for (const [dx, dy, r] of [[-0.2, 0.05, 0.22], [0.05, -0.05, 0.28], [0.25, 0.08, 0.2]]){ c.beginPath(); c.arc(px + ps * (0.5 + dx) + (dx < 0 ? -off : off), py + ps * (0.5 + dy), ps * r, 0, 6.2832); c.fill(); } }
  } else if (V.kind === 'snow'){
    // снег: морозная пелена и снежинки; тает — пелена уходит, снежинки падают вниз
    c.fillStyle = 'rgba(238,246,255,' + (0.82 * a).toFixed(3) + ')'; c.fillRect(px, py, ps, ps);
    c.strokeStyle = 'rgba(160,190,230,' + (0.9 * a).toFixed(3) + ')'; c.lineWidth = Math.max(1, ps * 0.03); c.lineCap = 'round';
    const fall = (1 - a) * ps * 0.4;
    for (const [fx, fy, fr] of [[0.3, 0.32, 0.13], [0.68, 0.45, 0.16], [0.42, 0.7, 0.11]]){
      const cx = px + fx * ps, cy = py + fy * ps + fall, rr2 = fr * ps;
      for (let i = 0; i < 3; i++){ const an = i * Math.PI / 3; c.beginPath(); c.moveTo(cx - Math.cos(an) * rr2, cy - Math.sin(an) * rr2); c.lineTo(cx + Math.cos(an) * rr2, cy + Math.sin(an) * rr2); c.stroke(); }
    }
  } else {
    const lit = V.lit || 0;           // 0 — погашен, 1 — горит
    c.fillStyle = 'rgba(10,14,30,' + (0.8 * a).toFixed(3) + ')'; c.fillRect(px, py, ps, ps);
    const off = IMG.lanternOff, on = IMG['sprite:lantern'], lh = ps * 0.92, lw = lh * 0.5, lx = px + ps / 2 - lw / 2, ly = py + ps * 0.06;
    const fade = clamp(a * 1.6, 0, 1);          // в конце фонарь тоже уходит, чтобы не мешать читать фото
    if (lit > 0){
      c.save(); c.globalCompositeOperation = 'screen';
      const g = c.createRadialGradient(px + ps / 2, ly + lh * 0.33, 1, px + ps / 2, ly + lh * 0.33, ps * 0.6);
      g.addColorStop(0, 'rgba(255,214,120,' + (0.9 * lit * fade).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,214,120,0)');
      c.fillStyle = g; c.fillRect(px, py, ps, ps); c.restore();
    }
    if (on && off){ c.globalAlpha = fade * (1 - lit); c.drawImage(off, 0, 0, off.width, off.height, lx - lw * 0.5, ly, lw * 2, lh);
      c.globalAlpha = fade * lit; c.drawImage(on, 0, 0, on.width, on.height, lx - lw * 0.5, ly, lw * 2, lh); c.globalAlpha = 1; }
    else { c.fillStyle = lit > 0.5 ? '#ffd27a' : '#556'; c.fillRect(px + ps * 0.44, py + ps * 0.2, ps * 0.12, ps * 0.16); c.fillRect(px + ps * 0.48, py + ps * 0.36, ps * 0.04, ps * 0.5); }
  }
  c.restore();
}

// --- состояние оболочки ---
const G = {
  s: null,                    // состояние ядра
  screen: 'menu',             // menu | game | help | win | lose | extra | stats
  save: Object.assign({ level: 0, mode: CFG.MODE_DEFAULT, muted: false, best: {}, metrics: {} }, loadSave()),
  world: null,                // переход света { a, b, from, to, t0, dur } или оборот { kf: [{ id, P }], t0, dur }
  vfId: 'golden',             // время кадра в видоискателе (меняется, когда кадр долетел)
  flights: [],                // летящие кадры [{ id, x0, y0, w0, rot0, t0, dur, dir }]
  bonusFlights: [],           // кадры шкалы летят на плёнку
  shakes: {}, reveal: {}, unveil: {},   // кадр → момент вздрагивания / открытия / снятия завесы { t0, kind }
  parts: [], floats: [],      // искры и конфетти; всплывающие надписи
  filmShake: 0, filmBump: 0, hintPulse: 0, flash: 0, banner: null, orbitAt: 0, orbitDir: 1, land: 0, sweep: null, streakPop: 0,
  eclipse: { on: false, t0: -1e9 },
  runLog: [], pipPop: {},     // времена текущего хода шкалы и момент «наполнения» каждой ячейки
  press: -1,                  // кадр под пальцем (приподнят)
  ending: null,               // { at, screen } — показать экран после анимаций
  lastInput: 0, lastAct: 0, errAt: 0,
  lv: null,                   // метрики текущего уровня
  fx: [],                     // открытые эффекты для журнала fx.end [{ name, until }]
  seen: {},                   // какие подсказки уже показаны за сеанс
  timeScale: 1, paused: false,
};
const nowMs = () => performance.now();
function fxStart(name, ms, info){ G.fx.push({ name, until: nowMs() + ms / G.timeScale }); log('fx.start', name, info); }

function worldAt(now){
  const w = G.world;
  if (!w) return { P: LP[G.vfId], a: G.vfId, b: G.vfId, t: 0 };
  if (w.kf){
    const t = clamp((now - w.t0) / w.dur, 0, 1), u = easeInOut(t) * (w.kf.length - 1), i = Math.min(w.kf.length - 2, Math.floor(u)), f = u - i;
    return { P: mixP(w.kf[i].P, w.kf[i + 1].P, f), a: w.kf[i].id, b: w.kf[i + 1].id, t: f };
  }
  const t = easeOut(clamp((now - w.t0) / w.dur, 0, 1));
  return { P: mixP(w.from, w.to, t), a: w.a, b: w.b, t };
}
// Перевести мир в время id. dir: +1 — позже (светила вперёд по дуге), -1 — раньше, 0 — кратчайшим путём.
function lightTo(id, dir, instant){
  const now = nowMs(), W0 = worldAt(now), cur = W0.P, L = LP[id];
  const to = Object.assign({}, L, { sunA: unwrapTo(cur.sunA, L.sunA, dir), moonA: unwrapTo(cur.moonA, L.moonA, dir) });
  const a = instant ? id : (W0.t > 0.5 ? W0.b : W0.a);
  G.world = { a, b: id, from: instant ? to : cur, to, t0: now, dur: Math.max(1, CFG.WORLD_MS / G.timeScale) };
  if (!instant){ fxStart('world', CFG.WORLD_MS, id); G.sweep = { t0: now, dir: dir || 1, col: LIGHT[id].glow }; }
  $('frame').style.background = LIGHT[id].top;
  try { document.querySelector('meta[name=theme-color]').setAttribute('content', LIGHT[id].top); } catch (e) {}
}
// «Полный день»: светила делают оборот, мир проходит все времена шкалы и возвращается в текущее.
function orbit(dir){
  const now = nowMs(), W0 = worldAt(now), ids = G.s.ids, V = ids.length, i0 = G.s.top;
  const kf = [{ id: W0.b, P: W0.P }]; let prev = W0.P;
  for (let j = 1; j <= V; j++){
    const id = ids[(((i0 + dir * j) % V) + V) % V], L = LP[id];
    const p = Object.assign({}, L, { sunA: unwrapTo(prev.sunA, L.sunA, dir), moonA: unwrapTo(prev.moonA, L.moonA, dir) });
    kf.push({ id, P: p }); prev = p;
  }
  G.world = { kf, t0: now, dur: CFG.ORBIT_MS / G.timeScale };
  fxStart('orbit', CFG.ORBIT_MS, 'dir=' + dir);
}

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
// Фон — спокойный эмбиент (Андрей 29.10 после телефона: прежний пэд и цикады звучали как гул). Постоянного тона нет:
// редкие мягкие ноты пентатоники (днём мажорной, вечером и ночью минорной) уходят в эхо, под ними — тихий прибой; утром — птицы.
const AMB = {
  dawn:     { root: 74, scale: 'maj', gap: 2.4, cut: 2400, sea: 0.8, birds: 0.5 },
  morning:  { root: 76, scale: 'maj', gap: 2.2, cut: 2800, sea: 0.7, birds: 1 },
  late:     { root: 76, scale: 'maj', gap: 2.2, cut: 3000, sea: 0.7, birds: 0.4 },
  noon:     { root: 77, scale: 'maj', gap: 2.6, cut: 3000, sea: 0.6, birds: 0 },
  day:      { root: 74, scale: 'maj', gap: 2.6, cut: 2800, sea: 0.7, birds: 0 },
  golden:   { root: 72, scale: 'maj', gap: 2.8, cut: 2200, sea: 0.9, birds: 0 },
  sunset:   { root: 69, scale: 'min', gap: 3.0, cut: 1900, sea: 1,   birds: 0 },
  dusk:     { root: 69, scale: 'min', gap: 3.2, cut: 1600, sea: 1,   birds: 0 },
  night:    { root: 64, scale: 'min', gap: 3.6, cut: 1300, sea: 0.9, birds: 0 },
  midnight: { root: 62, scale: 'min', gap: 4.0, cut: 1100, sea: 0.8, birds: 0 },
  eclipse:  { root: 57, scale: 'min', gap: 4.4, cut: 900,  sea: 0.6, birds: 0 },

const SCALES_AMB = { maj: [0, 2, 4, 7, 9, 12, 14, 16], min: [0, 3, 5, 7, 10, 12, 15, 17] };
const SND = { MASTER: 0.9, AMB: 0.032, BASS: 0.022, SEA: 0.05, ECHO: 0.42, BIRD: 0.025, SHUTTER: 0.4, NOTE: 0.09 };

const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const sndRnd = mulberry32(4242);
const Snd = {
  ac: null, master: null, noise: null, amb: null, ambCut: null, sea: null, seaCut: null, A: null, step: 2, nextNote: 0, nNotes: 0, birds: 0, nextBird: 0, timeId: null,
  init(){

    const ac = this.ac;

    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0), nr = mulberry32(99);
    for (let i = 0; i < len; i++) d[i] = nr() * 2 - 1;

    this.ambCut = ac.createBiquadFilter(); this.ambCut.type = 'lowpass'; this.ambCut.frequency.value = 2400;
    this.amb = ac.createGain(); this.amb.gain.value = 1; this.amb.connect(this.ambCut).connect(this.master);
    const dl = ac.createDelay(2), fb = ac.createGain(), wet = ac.createGain(), dcut = ac.createBiquadFilter();
    dl.delayTime.value = 0.46; fb.gain.value = 0.42; wet.gain.value = SND.ECHO; dcut.type = 'lowpass'; dcut.frequency.value = 1700;
    this.ambCut.connect(dl); dl.connect(dcut).connect(fb).connect(dl); dcut.connect(wet).connect(this.master);
    // прибой: бурый шум 6 с, низкий срез, громкость дышит медленной волной
    const sl = ac.sampleRate * 6, sb = ac.createBuffer(1, sl, ac.sampleRate), sd = sb.getChannelData(0), sr = mulberry32(7); let br = 0;
    for (let i = 0; i < sl; i++){ br = (br + 0.02 * (sr() * 2 - 1)) / 1.02; sd[i] = br * 3.5; }
    const src = ac.createBufferSource(); src.buffer = sb; src.loop = true;
    this.seaCut = ac.createBiquadFilter(); this.seaCut.type = 'lowpass'; this.seaCut.frequency.value = 520;
    const swell = ac.createGain(); swell.gain.value = 0.6;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.085; const lg = ac.createGain(); lg.gain.value = 0.4; lfo.connect(lg).connect(swell.gain);

  setMuted(m){ if (this.master) this.master.gain.setTargetAtTime(m ? 0 : SND.MASTER, this.ac.currentTime, 0.03); },
  tick(now){
    if (!this.ac || G.save.muted || G.paused || !this.A) return;
    if (now >= this.nextNote){
      const A = this.A, sc = SCALES_AMB[A.scale], t = this.ac.currentTime + 0.02;

// --- метрики плейтеста: копятся в сейве по режиму (8 / 10), отдельно «все уровни» и «с 3-го» ---
function newLv(li){ return { li, mode: G.s.V === 10 ? 10 : 8, t0: nowMs(), plays: 0, draws: 0, errSame: 0, errSkip: 0, errVeil: 0, covered: 0, firstPlayT: null, firstJuiceT: null, thinkSum: 0, thinkN: 0, closed: false, bot: false }; }
function closeLevel(result){
  const lv = G.lv; if (!lv || lv.closed) return; lv.closed = true;
  if (lv.bot){ log('event', 'metrics.skip', 'бот'); return; }   // прогоны ботом из хука в статистику плейтеста не идут
  const s = G.s, streaks = s.streaks.concat(s.streak ? [s.streak] : []);
  const M = G.save.metrics, key = lv.mode;
  M[key] = M[key] || {};
  for (const bucket of ['all', lv.li >= 2 ? 'from3' : null]){
    if (!bucket) continue;
    const B = M[key][bucket] = M[key][bucket] || {};
    const add = (k, v) => { B[k] = (B[k] || 0) + v; };
    add('levels', 1); add(result === 'win' ? 'wins' : result === 'lose' ? 'losses' : 'quits', 1);
    add('extras', s.extraUsed); add('plays', lv.plays); add('draws', lv.draws); add('errSame', lv.errSame); add('errSkip', lv.errSkip); add('errVeil', lv.errVeil); add('covered', lv.covered);

}
function statsHtml(){
  const M = G.save.metrics, pc = (a, b) => (b ? Math.round(100 * a / b) + '%' : '—'), f1 = (x) => (isFinite(x) ? x.toFixed(1) : '—'), z = (x) => x || 0;

// --- геометрия экрана (виртуальные юниты, ширина VW) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = 400;
let scale = 1, W = VW, H = 700, DPR = 1, geomCache = null;
function horizonY(){ return Math.round(clamp(H * CFG.HORIZON_FRAC, 150, 260)); }
// Позиции кадров на столе: ширина из ширины кадра, ряды с перекрытием, поле между горизонтом и панелью.
function fieldGeom(){
  if (geomCache && geomCache.W === W && geomCache.H === H && geomCache.lay === G.s.lay) return geomCache;
  const lay = G.s.lay, span = lay.width;
  let pitch = Math.min(CFG.TILE_MAX + CFG.TILE_GAP, (VW - 2 * CFG.SIDE) / span);
  const top0 = horizonY() + 12, bot0 = panelGeom().top - 6, avail = bot0 - top0;
  const fh = (p) => (p - CFG.TILE_GAP) * CFG.POLA_RATIO * (1 + lay.height * CFG.ROW_STEP);
  if (fh(pitch) > avail) pitch = CFG.TILE_GAP + avail / (CFG.POLA_RATIO * (1 + lay.height * CFG.ROW_STEP));
  const tw = pitch - CFG.TILE_GAP, th = tw * CFG.POLA_RATIO, rowStep = th * CFG.ROW_STEP, h = th + lay.height * rowStep;
  const y0 = top0 + (avail - h) * 0.4, x0 = (VW - span * pitch) / 2;
  const tiles = lay.x.map((x, k) => ({ x: x0 + (x + 0.5) * pitch, y: y0 + lay.y[k] * rowStep + th / 2, w: tw, h: th,
    rot: (mulberry32(31 + k * 7)() - 0.5) * 2 * CFG.TILE_ROT_DEG * Math.PI / 180 }));
  return (geomCache = { W, H, lay, tiles, tw, th });
}
function tileGeom(k){ return fieldGeom().tiles[k]; }
// Кадр под пальцем: перебор спереди назад (по глубине); открытым кадрам — запас по краям.
function tileAt(p){
  const s = G.s, F = fieldGeom(), lay = s.lay;
  for (let i = lay.order.length - 1; i >= 0; i--){
    const k = lay.order[i]; if (!s.present[k]) continue;
    const T = F.tiles[k], pad = s.cover[k] ? 0 : 4;
    if (Math.abs(p.x - T.x) <= T.w / 2 + pad && Math.abs(p.y - T.y) <= T.h / 2 + pad) return k;
  }
  return -1;
}

// --- рендер ---
function bigR(){ const hor = horizonY(); return { x: 0, y: 0, w: W, h: H, hor, cx: W / 2, rx: W * 0.46, ry: hor - 62, sunR: 18, moonR: 14, cityH: 60, crop: [0, 1], mini: false }; }

// Полоса света пробегает по небу в сторону хода — «таймлапс».
function drawSweep(now, R){
  const S = G.sweep; if (!S) return;
  const t = (now - S.t0) / (CFG.WORLD_MS * 1.6 / G.timeScale); if (t >= 1){ G.sweep = null; return; }
  const e = easeInOut(t), x = S.dir > 0 ? -120 + e * (W + 240) : W + 120 - e * (W + 240);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(x - 90, 0, x + 90, 0), a = 0.22 * Math.sin(t * Math.PI);

// Дождь (пока ждёт дневного кадра) — косые струи над заливом; радуга — дуга через небо, пока к ней подходит любой кадр.
const RAIN_DROPS = (() => { const r = mulberry32(919), out = []; for (let i = 0; i < 90; i++) out.push({ x: r(), y: r(), l: 8 + r() * 10, s: 0.6 + r() * 0.6 }); return out; })();
function drawWeather(now, R){
  const s = G.s; if (!s) return;
  const ra = G.rainFx.on ? clamp((now - G.rainFx.t0) / 500, 0, 1) : 1 - clamp((now - G.rainFx.t0) / 500, 0, 1);
  if (ra > 0.01){
    ctx.fillStyle = 'rgba(40,50,70,' + (0.18 * ra).toFixed(3) + ')'; ctx.fillRect(0, 0, W, R.hor + 40);
    ctx.strokeStyle = 'rgba(210,225,245,' + (0.5 * ra).toFixed(3) + ')'; ctx.lineWidth = 1.2;
    for (const d of RAIN_DROPS){ const y = ((d.y * H + now * 0.6 * d.s) % (H * 0.75)), x = d.x * W - y * 0.25; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - d.l * 0.25, y + d.l); ctx.stroke(); }
  }
  const rb = G.rainbowFx.on ? clamp((now - G.rainbowFx.t0) / 700, 0, 1) : 1 - clamp((now - G.rainbowFx.t0) / 600, 0, 1);
  if (rb > 0.01){
    const cols = ['#ff5a4e', '#ff9f3a', '#ffe14a', '#5fd36a', '#4aa8ff', '#7a5cff'], cx = W / 2, cy = R.hor + 30, r0 = W * 0.62;

// Падающая звезда: искрящаяся звезда с хвостом медленно падает по небу; в последнее действие мигает; тап — поймать.
function drawStar(now){
  const F = G.starFx; if (!F || !G.s) return;

  const tr = ctx.createLinearGradient(p.x - 70, p.y - 32, p.x, p.y); tr.addColorStop(0, 'rgba(255,240,190,0)'); tr.addColorStop(1, 'rgba(255,240,190,0.7)');
  ctx.strokeStyle = tr; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x - 70, p.y - 32); ctx.lineTo(p.x, p.y); ctx.stroke();
  const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 3); g.addColorStop(0, 'rgba(255,248,210,0.95)'); g.addColorStop(1, 'rgba(255,220,140,0)');

// Заказ: бумажный ярлык под шапкой справа — мини-кадр времени и клетки прогресса; выполнен — улетает на плёнку.

function drawOrderTag(now){

  }
}
// Подсказка-рука: в уроке — на нужный кадр или плёнку; на обычных уровнях — после долгого бездействия.
function hintTarget(now){
  const s = G.s; if (G.ending || G.screen !== 'game' || G.flights.length) return null;
  const pl = playable(s), tgt = pl.length ? pl[0] : s.stock.length ? 'film' : canWild(s) ? 'wild' : null; if (tgt === null) return null;
  if ((LEVELS[s.li] || {}).tutorial){
    const idle = now - Math.max(G.lastAct, G.lastInput) > CFG.TUT_HINT_MS, err = G.errAt && now - G.errAt < 1500;
    if (s.moves === 0 || idle || err || (tgt === 'film' && now - G.lastAct > 900)) return tgt;
    return null;
  }
  if (now - Math.max(G.lastAct, G.lastInput) > CFG.IDLE_HINT_MS) return pl.length ? greedyPick(s, pl, () => 0.5) : tgt;
  return null;
}
function drawHint(now){
  const tgt = hintTarget(now); if (tgt === null) return;
  let x, y; const Pg = panelGeom();
  if (tgt === 'film'){ x = Pg.filmC.x; y = Pg.filmC.y - 6; }
  else if (tgt === 'wild'){ x = Pg.wild.x; y = Pg.wild.y; }
  else { const T = tileGeom(tgt); x = T.x; y = T.y; }
  // нажатие: рука подъезжает к цели и «жмёт» (сжимается), в момент касания расходится кольцо
  const ph = (now % 1200) / 1200, press = ph < 0.35 ? easeInOut(ph / 0.35) : ph < 0.5 ? 1 : 1 - easeInOut((ph - 0.5) / 0.5);
  if (ph > 0.35 && ph < 0.95){ const rt = (ph - 0.35) / 0.6; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * (1 - rt)).toFixed(2) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 10 + rt * 22, 0, 6.2832); ctx.stroke(); }
  const sp = IMG['sprite:hand'], sz = 64, off = 14 * (1 - press);
  ctx.save(); ctx.translate(x + off, y + off); ctx.scale(1 - 0.06 * press, 1 - 0.06 * press);
  if (sp) ctx.drawImage(sp, -sz * ART.HAND_TIP[0], -sz * ART.HAND_TIP[1], sz, sz);
  else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.2832); ctx.fill(); }
  ctx.restore();
}
function drawFx(now){
  if (G.flash){ const t = (now - G.flash) / (CFG.FLASH_MS / G.timeScale); if (t < 1){ ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * (1 - t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } else G.flash = 0; }
  if (G.banner){
    const t = (now - G.banner.t0) / (CFG.BANNER_MS / G.timeScale);
    if (t >= 1) G.banner = null;
    else if (t >= 0){
      const a = t < 0.15 ? t / 0.15 : t > 0.8 ? (1 - t) / 0.2 : 1, sc = 0.7 + 0.3 * easeOutBack(clamp(t / 0.25, 0, 1));
      ctx.save(); ctx.translate(W / 2, horizonY() * 0.62); ctx.scale(sc, sc); ctx.globalAlpha = a;
      ctx.font = '900 40px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(20,10,30,0.55)'; ctx.strokeText(G.banner.text, 0, 0);
      ctx.fillStyle = '#fff6d8'; ctx.fillText(G.banner.text, 0, 0);
      if (G.banner.sub){ ctx.font = '800 20px system-ui, sans-serif'; ctx.lineWidth = 5; ctx.strokeText(G.banner.sub, 0, 34); ctx.fillStyle = '#ffd27a'; ctx.fillText(G.banner.sub, 0, 34); }
      ctx.restore();
    }
  }
}
// Контактный лист для проверки палитры: все 10 времён по кругу — крупно (72) и размером кадра на столе (36).
function drawSheet(){
  ctx.fillStyle = '#1a1b22'; ctx.fillRect(0, 0, W, H);
  const ids = SCALES[10]; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#fff'; ctx.font = '600 11px system-ui, sans-serif';
  ids.forEach((id, i) => {
    const x = 40 + (i % 5) * 80, y = 30 + Math.floor(i / 5) * 120;
    drawPolaroid(ctx, x, y + 50, 72, 0, id, 1, {}); ctx.fillText(TIME_NAMES[id], x, y + 98);
  });
  ['8', '10'].forEach((k, r) => SCALES[k].forEach((id, i) => {
    const n = SCALES[k].length, pitch = Math.min(38, (VW - 20) / n), x = (VW - n * pitch) / 2 + (i + 0.5) * pitch;
    drawPolaroid(ctx, x, 300 + r * 70, pitch - 2.5, 0, id, 1, {});
  }));
  const veils = [['cloud', 0], ['lantern', 0], ['lantern', 1]];
  veils.forEach(([kind, lit], i) => drawPolaroid(ctx, 80 + i * 120, 470, 72, 0, 'noon', 1, { veil: { kind, a: 1, t: 0, lit } }));
}

// Галерея форм для проверки глазом: список уровней — сетка 3 колонки, в каждой ячейке форма уровня (белые — открытые, тёмные — закрытые).
function drawGallery(list){
  ctx.fillStyle = '#1a1b22'; ctx.fillRect(0, 0, W, H);
  const cols = 3, cw = W / cols, ch = Math.min(170, (H - 20) / Math.ceil(list.length / cols));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '600 11px system-ui, sans-serif';
  list.forEach((li, idx) => {
    const L = buildLayout(levelSpec(li, G.save.mode).layout), cx = (idx % cols) * cw, cy = 10 + Math.floor(idx / cols) * ch;
    const pitch = Math.min((cw - 12) / L.width, (ch - 30) / (CFG.POLA_RATIO * (1 + L.height * CFG.ROW_STEP))), tw = pitch * 0.92, th = tw * CFG.POLA_RATIO;
    const x0 = cx + (cw - L.width * pitch) / 2, y0 = cy + 16;
    for (const k of L.order){ const x = x0 + (L.x[k] + 0.5) * pitch, y = y0 + L.y[k] * th * CFG.ROW_STEP + th / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(x - tw / 2 + 1, y - th / 2 + 1.5, tw, th);
      ctx.fillStyle = L.initCover[k] ? '#5a5248' : '#fbf8f0'; ctx.fillRect(x - tw / 2, y - th / 2, tw, th);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.6; ctx.strokeRect(x - tw / 2, y - th / 2, tw, th); }
    ctx.fillStyle = '#fff'; ctx.fillText((li + 1) + ' · ' + L.title + ' · ' + L.n, cx + cw / 2, cy);
  });
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4). Кадр под try/catch. ---
let lastFrame = 0, lastErr = 0;
function safeRender(){ try { render(); } catch (e) { const n = nowMs(); if (n - lastErr > 1000){ lastErr = n; log('event', 'error', e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e); } } }
function frame(){ lastFrame = nowMs(); if (!G.paused) safeRender(); requestAnimationFrame(frame); }
setInterval(() => { if (nowMs() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6) ---
window.GOLDEN = {
  G, CFG, LEVELS, IMG,
  state(){
    const s = G.s; if (!s) return { screen: G.screen, mode: G.save.mode };
    return { screen: G.screen, level: s.li + 1, mode: G.save.mode, V: s.V, top: s.wildTop ? 'eclipse' : s.ids[s.top], vf: G.vfId, film: s.stock.length, left: s.left,
      playable: playable(s), open: exposed(s).map(k => k + ':' + s.ids[s.tab[k]] + (s.veil[k] ? '/' + s.veil[k] : '')), streak: s.streak, dirRun: s.dirRun, dir: s.dir,
      wilds: s.wilds, fullDays: s.fullDays, gaugeFrames: s.gaugeFrames, win: isWin(s), stuck: isStuck(s), canExtra: canExtra(s), lose: isLose(s), ending: G.ending && G.ending.screen,
      art: Object.keys(IMG).length };
  },
  play(n){ startLevel(clamp((n || 1) - 1, 0, 99999)); return this.state(); },
  tap(k){ G.lastInput = nowMs(); tapTile(k); return this.state(); },
  draw(){ G.lastInput = nowMs(); tapFilm(); return this.state(); },
  wild(){ G.lastInput = nowMs(); tapWild(); return this.state(); },
  extra(){ takeExtra(); return this.state(); },
  goto(screen){ goto(screen); return G.screen; },
  mode(m){ G.save.mode = m === 10 ? 10 : 8; save(); if (G.s) startLevel(G.s.li); return G.save.mode; },
  solve(){ return G.s ? solve(G.s) : null; },
  step(){                                       // один ход жадного бота
    const s = G.s; if (!s || G.screen !== 'game') return null;
    const act = botPick(s, 'greedy', mulberry32(s.moves + 1));
    if (G.lv) G.lv.bot = true;
    if (act === 'draw') tapFilm(); else if (act === 'wild') tapWild(); else if (act !== null) tapTile(act);
    return act;
  },
  auto(delayMs){                                // жадный бот играет уровень; на «Почти!» берёт +3
    const d = delayMs || 450; clearInterval(this._auto);
    this._auto = setInterval(() => {
      if (G.screen === 'extra') return takeExtra();
      if (G.screen !== 'game' || G.ending){ if (G.screen !== 'game') clearInterval(this._auto); return; }
      if (G.flights.length) return;
      if (this.step() === null) clearInterval(this._auto);
    }, d);
    return 'auto ' + d + ' мс';
  },
  stop(){ clearInterval(this._auto); return 'stopped'; },
  drive(sec){                                   // ручной прогон времени: rAF заморожен в скрытой вкладке
    const end = nowMs() + sec * 1000; let n = 0;
    while (nowMs() < end && n < 100000){ safeRender(); n++; }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  metrics(){ return G.save.metrics; },
  light(id){ lightTo(id, 0); Snd.setTime(id); return id; },   // посмотреть время суток без хода
  sheet(on){ G.sheet = on !== false; return G.sheet; },       // контактный лист всех времён и завес
  gallery(list){ G.gallery = list === false ? null : (list || [...Array(12).keys()]).map(n => n - 1); return G.gallery; },   // формы уровней (номера с 1)
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
loadArt(); fit(); hud();
lightTo(G.vfId, 0, true);
const startHash = location.hash.slice(1);
const startLvl = /^lvl(\d+)$/.exec(startHash);
if (startLvl) startLevel(Math.max(0, +startLvl[1] - 1)); else if (startHash === 'game') startLevel(G.save.level); else goto(startHash || 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length + ' mode=' + G.save.mode);
</script>
